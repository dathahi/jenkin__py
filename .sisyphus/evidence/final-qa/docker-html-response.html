<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Go Demo - Jenkins Learning</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 { color: #00d4aa; margin-bottom: 1rem; }
        .info { 
            margin: 0.5rem 0; 
            color: #a0a0a0;
            font-size: 0.95rem;
        }
        .label { color: #888; }
        .value { color: #fff; font-weight: 500; }
        .version { 
            margin-top: 1.5rem; 
            padding-top: 1rem; 
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Go Demo - Jenkins Learning</h1>
        <div class="info">
            <span class="label">Hostname:</span> 
            <span class="value">ecd33c4739d0</span>
        </div>
        <div class="info">
            <span class="label">Server Started:</span> 
            <span class="value">2026-05-05 07:26:14</span>
        </div>
        <div class="info">
            <span class="label">Uptime:</span> 
            <span class="value">9s</span>
        </div>
        <div class="version">Version 1.0.0</div>
    </div>
</body>
</html>
